<!DOCTYPE html>
<html>
<head>

<title>AI Mock Interview</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#4facfe,#00f2fe);
    margin:0;
    padding:0;
}

.container{
    width:60%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.start-btn{
    display:block;
    margin:0 auto 25px auto;
    background:#27ae60;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.start-btn:hover{
    background:#219150;
}

.question{
    margin-bottom:20px;
}

.question p{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

.submit-btn{
    width:100%;
    background:#3498db;
    color:white;
    border:none;
    padding:12px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#2c80b4;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Mock Interview</h2>

<button class="start-btn" onclick="openCamera()">Start Interview</button>

<form action="/submit" method="post">

{% for q in questions %}

<div class="question">
<p>{{q}}</p>
<input type="text" name="answer{{loop.index0}}" required>
</div>

{% endfor %}

<button class="submit-btn" type="submit">Submit Interview</button>

</form>

</div>

<script>

function openCamera(){

fetch("/camera")
.then(res => res.text())
.then(data => console.log(data))

}

</script>

</body>
</html>
